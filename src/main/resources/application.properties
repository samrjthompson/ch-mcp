spring.application.name=ch-mcp
#spring.data.security.user.name=admin
#spring.data.security.user.password=password

server.port=8081

management.endpoints.enabled-by-default=false
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=healthcheck
management.endpoint.health.show-details=never
management.endpoint.health.enabled=true
management.health.db.enabled=false

companies-house.base-url=https://api.company-information.service.gov.uk
companies-house.api-key=${CH_API_KEY:api-key}
companies-house.connect-timeout=5s
companies-house.request-timeout=10s

logging.structured.format.console=ecs